name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install fixed image dependency
        run: python -m pip install -r skills/tiled-asset-pipeline/scripts/requirements.txt
      - name: Behaviour tests
        run: python -B -m unittest discover -s tests -v
      - name: Skill and repository checks
        run: python -B tools/validate_release.py
